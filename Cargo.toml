[package]
name = "QuadTexture"
version = "0.1.0"
edition = "2024"
publish = false
description = "Picasso GLB tile gallery with flycam and a separate native quad probe."

[package.metadata.trueos-blueprint]
replicatable = true

[[bin]]
name = "QuadTexture"
path = "src/main.rs"
test = false
bench = false

[dependencies]
trueos = { path = "../TRUEOS-Blueprints/api" }
trueos-picasso = { path = "../TRUEOS-Picasso", default-features = false, features = ["blueprint"] }
libm = "0.2"

[build-dependencies]
png = { path = "../TRUEOS/vendor/png-0.18.1", default-features = false }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
crc32fast = { version = "1.5", default-features = false }
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
bevy_mikktspace = "=0.15.3"
serde_json = "1"
sha2 = "0.10"
trueos-picasso = { path = "../TRUEOS-Picasso", default-features = false, features = ["host"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
